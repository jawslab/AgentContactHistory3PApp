version = 0.1

[default.global.parameters]
stack_name = "agent-contact-history"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "TableName=\"AgentContactHistory\" CreateKinesisStream=\"true\" TtlHours=\"24\" CorsAllowOrigin=\"*\""
